<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Página no encontrada — Blog Estático</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Grid de fondo (estilo portafolio) -->
  <div class="back-grid"></div>

  <main class="main-content" role="main" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
    <div style="text-align: center; max-width: 480px;">
      <h1 style="font-size: 4rem; font-weight: 800; color: var(--accent); margin-bottom: 0.5rem;">404</h1>
      <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--accent); margin-bottom: 0.75rem;">Página no encontrada</h2>
      <p style="color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6;">
        La página que buscas no existe o ha sido movida.
      </p>
      <a href="?" style="display: inline-block; background: var(--accent); color: #fff; padding: 0.75rem 1.9rem; border-radius: 30px; text-transform: uppercase; font-size: 0.82rem; font-weight: 600; text-decoration: none; box-shadow: 0 0 14px -2px var(--accent-glow); transition: background 0.3s;">
        Volver al inicio
      </a>
    </div>
  </main>
</body>
</html>
